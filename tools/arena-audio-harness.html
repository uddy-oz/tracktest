<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StanZer Arena audio harness</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        color: #f5f1ff;
        background: #0d0b14;
        font: 16px/1.5 system-ui, sans-serif;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
      }

      button {
        border: 1px solid #9676ff;
        border-radius: 6px;
        padding: 12px 18px;
        color: white;
        background: #6d45e8;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      pre {
        overflow: auto;
        margin-top: 20px;
        padding: 16px;
        border: 1px solid #30284b;
        border-radius: 6px;
        background: #151220;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>StanZer Arena audio lifecycle harness</h1>
      <p id="description">
        Runs the production Arena audio controller through consecutive,
        sequential iTunes preview preparations. Open the console for structured lifecycle logs.
      </p>
      <button id="run" type="button">Run preview preparations</button>
      <pre id="results">Ready.</pre>
      <audio id="arena-audio" preload="auto"></audio>
    </main>

    <script type="module">
      import { ArenaAudioController } from "/src/lib/arenaAudioController.ts";

      const harnessParams = new URLSearchParams(window.location.search);
      const TEST_ALBUM_ID = harnessParams.get("album") || "1584449196";
      const TEST_ROUNDS = Math.max(1, Number(harnessParams.get("rounds")) || 50);
      const TEST_READY_MS = Math.max(
        1200,
        Number(harnessParams.get("readyMs")) || 3200
      );
      const TEST_REMATCHES = Math.max(
        1,
        Number(harnessParams.get("rematches")) || 3
      );
      const TEST_CLIP_SECONDS = 0.5;
      const repeatOnePreview = harnessParams.has("repeat");
      const output = document.querySelector("#results");
      const runButton = document.querySelector("#run");
      const description = document.querySelector("#description");
      const audio = document.querySelector("#arena-audio");
      const sleep = (milliseconds) =>
        new Promise((resolve) => window.setTimeout(resolve, milliseconds));

      audio.muted = true;
      description.textContent = `Runs the production Arena audio controller through ${TEST_ROUNDS} consecutive, sequential iTunes preview preparations and ${TEST_REMATCHES} rematches. Open the console for structured lifecycle logs.`;
      runButton.textContent = `Run ${TEST_ROUNDS} preview preparations`;

      async function getPreviewUrls() {
        const response = await fetch(
          `https://itunes.apple.com/lookup?id=${TEST_ALBUM_ID}&entity=song&country=US`
        );
        if (!response.ok) {
          throw new Error(`iTunes lookup failed with ${response.status}.`);
        }

        const data = await response.json();
        const previews = data.results
          .filter(
            (item) =>
              item.wrapperType === "track" &&
              item.kind === "song" &&
              item.previewUrl
          )
          .map((item) => ({ name: item.trackName, url: item.previewUrl }));

        const source = repeatOnePreview
          ? Array.from({ length: TEST_ROUNDS }, () => previews[0])
          : Array.from(
              { length: TEST_ROUNDS },
              (_, index) => previews[index % previews.length]
            );
        return source;
      }

      runButton.addEventListener("click", async () => {
        runButton.disabled = true;
        output.textContent = "Loading previews...";
        const controller = new ArenaAudioController();
        const results = [];
        const confirmedRoundKeys = new Set();

        controller.attach(audio);
        controller.setCallbacks({
          onPlaybackConfirmed: (roundKey) => confirmedRoundKeys.add(roundKey),
          onPlaybackFailure: (failure) => {
            console.error("Harness playback failure", failure);
          },
        });

        try {
          const unlockPromise = controller.unlockFromUserGesture();
          const previews = await getPreviewUrls();
          if (!previews[0]) {
            throw new Error("No playable previews were returned.");
          }
          if (!(await unlockPromise)) {
            throw new Error("The browser did not unlock the audio device.");
          }

          for (let index = 0; index < previews.length; index += 1) {
            const preview = previews[index];
            const nextPreviews = previews.slice(index + 1, index + 4);
            const roundKey = `harness:1:${index}`;
            let observedProgress = 0;
            let previousPlaybackTime = null;
            const observeProgress = () => {
              if (audio.paused) return;

              if (previousPlaybackTime !== null) {
                observedProgress += Math.max(
                  0,
                  audio.currentTime - previousPlaybackTime
                );
              }
              previousPlaybackTime = audio.currentTime;
            };

            controller.prepareRound(
              {
                roomId: "harness",
                matchGeneration: 1,
                mode: "duel",
                roundKey,
                roundId: `round-${index}`,
                roundIndex: index,
                phase: "preparing_audio",
                previewUrl: preview.url,
                clipStartSeconds: 6 + (index % 12),
                serverTimestamp: new Date().toISOString(),
              },
              nextPreviews.map((nextPreview, offset) => ({
                previewUrl: nextPreview.url,
                clipStartSeconds: 6 + ((index + offset + 1) % 12),
                roundIndex: index + offset + 1,
              }))
            );
            audio.addEventListener("timeupdate", observeProgress);
            const readiness = await controller.waitUntilRoundReady(
              roundKey,
              TEST_CLIP_SECONDS,
              { deadlineMs: Date.now() + TEST_READY_MS, maxAttempts: 2 }
            );

            if (readiness.status !== "ready") {
              results.push({
                round: index + 1,
                track: preview.name,
                status: "readiness-failed",
                readiness: readiness.status,
                readinessReason:
                  readiness.status === "failed" ? readiness.reason : "STALE_ROUND",
                readinessMessage:
                  readiness.status === "failed" ? readiness.message : readiness.status,
              });
              output.textContent = JSON.stringify(results, null, 2);
              continue;
            }

            const result = await controller.startRound({
              roundKey,
              timelineStartsAtMs: Date.now(),
              clockOffsetMs: 0,
              clipLengthSeconds: TEST_CLIP_SECONDS,
            });
            await sleep(TEST_CLIP_SECONDS * 1000 + 120);
            audio.removeEventListener("timeupdate", observeProgress);

            results.push({
              round: index + 1,
              track: preview.name,
              status: result.status,
              readiness: readiness.status,
              readinessAttempts: readiness.attempts,
              prefetched: readiness.prefetched,
              actualPlaybackObserved:
                confirmedRoundKeys.has(roundKey) || observedProgress > 0.05,
              readyState: audio.readyState,
              networkState: audio.networkState,
            });
            output.textContent = JSON.stringify(results, null, 2);
          }

          const passed = results.filter(
            (result) =>
              result.status === "playing" && result.actualPlaybackObserved
          ).length;
          const sequenceMetrics = controller.getReliabilityMetrics();

          const rematchGenerationResults = [];
          for (
            let generation = 2;
            generation < 2 + TEST_REMATCHES;
            generation += 1
          ) {
            controller.resetMatch(`harness-rematch-generation-${generation}`);
            const rematchRoundKey = `harness:${generation}:round-1`;
            const preview = previews[(generation - 2) % previews.length];
            const nextPreview = previews[(generation - 1) % previews.length];
            controller.prepareRound(
              {
                roomId: "harness",
                matchGeneration: generation,
                mode: "duel",
                roundKey: rematchRoundKey,
                roundId: `rematch-${generation}-round-1`,
                roundIndex: 0,
                phase: "preparing_audio",
                previewUrl: preview.url,
                clipStartSeconds: 9,
              },
              [
                {
                  previewUrl: nextPreview.url,
                  clipStartSeconds: 10,
                  roundIndex: 1,
                },
              ]
            );
            const rematchReadiness = await controller.waitUntilRoundReady(
              rematchRoundKey,
              TEST_CLIP_SECONDS,
              { deadlineMs: Date.now() + TEST_READY_MS, maxAttempts: 2 }
            );
            const rematchStartTime = audio.currentTime;
            const rematchResult = await controller.startRound({
              roundKey: rematchRoundKey,
              timelineStartsAtMs: Date.now(),
              clockOffsetMs: 0,
              clipLengthSeconds: TEST_CLIP_SECONDS,
            });
            await sleep(700);
            rematchGenerationResults.push(
              rematchReadiness.status === "ready" &&
                rematchResult.status === "playing" &&
                (confirmedRoundKeys.has(rematchRoundKey) ||
                  audio.currentTime > rematchStartTime + 0.05)
            );
            controller.stopRound(rematchRoundKey, {
              reason: "harness-rematch-complete",
            });
          }
          const rematchGenerationPassed = rematchGenerationResults.every(Boolean);

          const staleRoundKey = "harness:stale:old";
          const currentRoundKey = "harness:stale:current";
          controller.prepareRound({
            roomId: "harness",
            matchGeneration: 1,
            mode: "duel",
            roundKey: staleRoundKey,
            roundId: "stale-old",
            roundIndex: TEST_ROUNDS,
            phase: "countdown",
            previewUrl: previews[0].url,
            clipStartSeconds: 8,
          });
          const staleResultPromise = controller.startRound({
            roundKey: staleRoundKey,
            timelineStartsAtMs: Date.now(),
            clockOffsetMs: 0,
            clipLengthSeconds: TEST_CLIP_SECONDS,
          });
          controller.prepareRound({
            roomId: "harness",
            matchGeneration: 2,
            mode: "duel",
            roundKey: currentRoundKey,
            roundId: "stale-current",
            roundIndex: TEST_ROUNDS + 1,
            phase: "countdown",
            previewUrl: previews[1].url,
            clipStartSeconds: 10,
          });
          const currentResult = await controller.startRound({
            roundKey: currentRoundKey,
            timelineStartsAtMs: Date.now(),
            clockOffsetMs: 0,
            clipLengthSeconds: TEST_CLIP_SECONDS,
          });
          const staleResult = await staleResultPromise;
          const currentStartTime = audio.currentTime;
          await sleep(700);
          const staleGuardPassed =
            staleResult.status === "stale" &&
            currentResult.status === "playing" &&
            (confirmedRoundKeys.has(currentRoundKey) ||
              audio.currentTime > currentStartTime + 0.05);

          const failureRoundKey = "harness:failure:bounded";
          controller.prepareRound({
            roomId: "harness",
            matchGeneration: 1,
            mode: "duel",
            roundKey: failureRoundKey,
            roundId: "failure-bounded",
            roundIndex: TEST_ROUNDS + 2,
            phase: "preparing_audio",
            previewUrl: "data:audio/mpeg;base64,AAAA",
            clipStartSeconds: 0,
          });
          const failureStartedAt = performance.now();
          const boundedFailure = await controller.waitUntilRoundReady(
            failureRoundKey,
            TEST_CLIP_SECONDS,
            { deadlineMs: Date.now() + 2200, maxAttempts: 3 }
          );
          const failureElapsedMs = performance.now() - failureStartedAt;
          const boundedFailurePassed =
            boundedFailure.status === "failed" &&
            boundedFailure.attempts >= 1 &&
            failureElapsedMs < 3000;

          const allGuardsPassed =
            rematchGenerationPassed && staleGuardPassed && boundedFailurePassed;
          document.title = `${passed}/${TEST_ROUNDS} passed${
            allGuardsPassed ? "" : " with guard failure"
          } - Arena audio harness`;
          output.textContent = `${passed}/${TEST_ROUNDS} rounds initiated playback.\nStale-round guard: ${
            staleGuardPassed ? "passed" : "FAILED"
          }.\nPersistent-controller rematches (${TEST_REMATCHES}): ${
            rematchGenerationPassed ? "passed" : "FAILED"
          }.\nBounded readiness failure: ${
            boundedFailurePassed
              ? `passed (${Math.round(failureElapsedMs)}ms, ${boundedFailure.attempts} attempts)`
              : "FAILED"
          }.\nReliability metrics: ${JSON.stringify(
            sequenceMetrics
          )}.\n\n${JSON.stringify(results, null, 2)}`;
        } catch (error) {
          console.error(error);
          output.textContent = error instanceof Error ? error.message : String(error);
        } finally {
          controller.dispose();
          runButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
